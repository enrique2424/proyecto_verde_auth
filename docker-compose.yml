version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: banco_verde_iam
      POSTGRES_USER: bv_user
      POSTGRES_PASSWORD: bv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bv_user -d banco_verde_iam"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
