filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/banco-verde/*.json
    json.keys_under_root: true
    json.add_error_key: true
    json.message_key: message
    json.overwrite_keys: true
    fields:
      service: iam-service
      environment: production
      log_type: security
    fields_under_root: true
    scan_frequency: 5s
    close_inactive: 5m
    harvester_buffer_size: 16384
    multiline:
      pattern: '^\{'
      negate: true
      match: after

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - timestamp:
      field: timestamp
      layouts:
        - '2006-01-02T15:04:05.999Z'
        - '2006-01-02T15:04:05.999-07:00'
      test:
        - '2026-09-14T10:23:45.123Z'
  - script:
      lang: javascript
      id: hash_validator
      file: /usr/share/filebeat/scripts/validate-hash.js

output.elasticsearch:
  hosts: ["wazuh.indexer:9200"]
  username: "admin"
  password: "ChangeThisPassword123!"
  ssl.enabled: true
  ssl.certificate_authorities: ["/usr/share/filebeat/config/root-ca.pem"]
  ssl.verification_mode: full
  index: "banco-verde-iam-%{+yyyy.MM.dd}"
  pipeline: "banco-verde-pipeline"

setup.template.name: "banco-verde"
setup.template.pattern: "banco-verde-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0
  index.lifecycle.name: "banco-verde-policy"
  index.lifecycle.rollover_alias: "banco-verde"

setup.ilm.enabled: true
setup.ilm.rollover_alias: "banco-verde"
setup.ilm.pattern: "{now/d}-000001"
setup.ilm.policy_name: "banco-verde-policy"

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
