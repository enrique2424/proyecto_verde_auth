# meta data requerida
sonar.projectKey=mcrm-gestion-comercial-login
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

#archivos a excluir del analisis
sonar.sources=src
sonar.exclusions=**/trivy_report_code.html,**/trivy_report_image.html,**/coverage/**/*,**/*.spec.ts,**/*.spec.js,**/node_modules/**
sonar.coverage.exclusions=**/trivy_report_code.html,**/trivy_report_image.html,**/*.spec.ts,**/*.spec.js,**/node_modules/**,**/cicd/**,**/dist/**,/node_modules/**,/cicd/**,/dist/**,node_modules/**,cicd/**,dist/**

# Información de pruebas unitarias
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.js

# Reporte de cobertura
sonar.javascript.lcov.reportPaths=coverage/lcov.info